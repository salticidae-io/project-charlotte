# Example configuration for project-charlotte.
#
# Pass this file with `--config`:
#
#     project-charlotte --config /etc/charlotte/charlotte.yaml \
#         --bind 0.0.0.0:80 --tls-bind 0.0.0.0:443 \
#         --tls-cert /etc/charlotte/default.pem \
#         --tls-key  /etc/charlotte/default.key
#
# To enable automatic HTTP-01 certificates for eligible virtual hosts without
# a per-vhost TLS certificate, add:
#     --acme-directory letsencrypt --acme-cache /var/lib/charlotte/acme
# The ACME server must be able to reach this server on port 80; renewals are
# triggered by plaintext requests when a cached certificate is within 30 days
# of expiry. Use `letsencrypt-staging` or a custom directory URL for testing.
#
# The file only describes virtual hosts. Listening sockets, the fallback
# document root, the fallback TLS certificate and the ModSecurity rule set are
# command-line options; see `project-charlotte --help`. Set the global blocking
# response status with `--modsecurity-block-status CODE` (400-599); a vhost may
# override it with `modsecurity_block_status` below.
# Bot detection is enabled with `--bot-detection` or `--bot-config FILE`; a
# vhost can override it with `bot: off` or a policy map.
#
# Worker-backed virtual hosts run in their own worker process, re-executing
# this binary with `--worker` and dropping privileges to the configured user
# and group. Proxy virtual hosts use `proxy_pass` and run in the master without
# a document root or worker user. A request whose Host header matches no
# virtual host is served by the master from `--root`, unless a virtual host is
# marked `default: true`.
#
# Relative paths (root, tls_cert, tls_key, proxy_ca_root, interpreter, unix:
# FastCGI sockets, access_log, error_log) are resolved against the directory
# containing this file, not the working directory.
# `vhost_dir` is also relative to this file; visible `*.yaml` and `*.yml` files
# in that directory are watched for additions, changes, deletions and renames.
# Invalid updates are rejected and the last valid configuration remains active.
#
# This file, the `vhost_dir` directory and the files in it decide which
# accounts and programs the server runs, so they must be owned by root or by
# the user running the server and must not be world-writable; otherwise the
# server refuses to load them.

vhost_dir: vhosts.d


# --------------------------------------------------------------------------
# A plain static site, marked as the catch-all for unmatched requests.
# --------------------------------------------------------------------------
vhost:
  -
# Required. One or more host names. A leading "*." makes it a wildcard that
# matches one or more labels in place of the star; "*.example.com" matches
# "www.example.com" but not "example.com" itself. Ports are not allowed, and a
# name may only appear once across the whole file. Exact matches beat
# wildcards, and a longer wildcard suffix beats a shorter one.
    server_names: [example.com, www.example.com]

# Required. Document root served by this virtual host's worker.
    root: /srv/www/example.com/public

# Required. The worker drops to this user. The account must exist and must
# not be root.
    user: www-example

# Optional. Defaults to the user's primary group.
    group: www-data

# Optional. Falls back to the --index value (default "index.html").
# Must be a bare file name: no "/", no "\", not "." or "..".
    index: index.html

# Optional. Falls back to --no-listing / the default of true.
    listing: false

# Optional. Try candidates in order; the final entry is an internal URI
# fallback or a status such as =404. Supported variables are $uri, $args,
# $query_string and $is_args. For example:
# try_files: ["$uri", "$uri/", "/index.html", "=404"]

# Optional. Requires global rules supplied with --modsecurity-rules. Rule IDs
# and inclusive ID ranges can be disabled for this vhost only; the rule-file
# ruleset remains active for every other host. For example:
# modsecurity_disable_rules: [100001, "2000-2099"]

# Optional. Requires global ModSecurity rules. Overrides the global
# --modsecurity-block-status for blocking interventions on this vhost; valid
# values are 400-599. Redirect interventions retain their configured status.
# modsecurity_block_status: 451

# Optional. Inherits the global bot policy by default; use `off` to exempt this
# host or a map to override selected policy fields. For example:
# bot: off
# bot:
#   mode: log
#   exempt_paths: [/health]

# Optional. Per-vhost log files and Apache-compatible formats. Each setting
# falls back to --access-log-file / --access-log-format and --error-log-file /
# --error-log-format. Files are appended to and must be writable by the server
# user. CGI and FastCGI stderr goes to this host's error log. For example:
# access_log: logs/example-access.log
# access_log_format: combined
# error_log: logs/example-error.log
# error_log_format: "[%t] [%l] [client %a] %M"

# Optional. At most one virtual host in the file may set this. It receives
# every request that matches no other host (and supplies the fallback
# certificate for TLS clients that send no SNI).
    default: true

# Optional, but required together. The certificate presented for these server
# names via SNI. PEM encoded; the key may be PKCS#8, PKCS#1 or SEC1.
    tls_cert: tls/example.com.pem
    tls_key: tls/example.com.key


# --------------------------------------------------------------------------
# A reverse proxy virtual host. It needs no document root or worker user.
# Supports HTTP/1.1, HTTP/2 and HTTP/3 clients; HTTPS upstreams use system
# trust roots unless `proxy_ca_root` names a PEM CA bundle.
# --------------------------------------------------------------------------
#  -
#    server_names: [api.example.com]
#    proxy_pass: https://backend.internal:8443/api
#    proxy_preserve_host: true
#    proxy_timeout: 60
#    proxy_ca_root: tls/backend-ca.pem

# --------------------------------------------------------------------------
# PHP over an existing FastCGI pool (php-fpm), reached over a Unix socket.
# --------------------------------------------------------------------------
  -
    server_names: [blog.example.com]
    root: /srv/www/blog/public
    user: www-blog
    index: index.php
    listing: false

# Each entry is "EXTENSION=ADDRESS". The extension is matched
# case-insensitively and a leading dot is optional, so "php", ".php" and
# ".PHP" are the same backend; an extension may only be declared once per
# virtual host. The address is either "unix:/path/to/socket" or "HOST:PORT"
# (bracket IPv6 literals, e.g. "[::1]:9000").
    fastcgi: ["php=unix:/run/php/php8.4-fpm.sock"]

# Classic CGI uses the same extension list. With no interpreter, the script
# must be executable; otherwise the configured interpreter receives its path.
# The script itself must resolve to a file inside this vhost's document root.
# Example: cgi: [cgi, "py=/usr/bin/python3"]

# Optional. Seconds to wait for the FastCGI backend before giving up.
# Falls back to --fastcgi-timeout (default 60). Must be greater than zero.
    fastcgi_timeout: 30

# Optional. Number of Tokio runtime threads in this vhost's worker process
# (1-1024). Falls back to --worker-threads (default 2). The master process
# thread count is set with --threads (default: one per CPU core).
    worker_threads: 4

    tls_cert: tls/blog.example.com.pem
    tls_key: tls/blog.example.com.key


# --------------------------------------------------------------------------
# A wildcard host where charlotte spawns and supervises the FastCGI process
# itself, instead of connecting to a pool someone else manages.
# --------------------------------------------------------------------------
  -
    server_names: ["*.customers.example.com"]
    root: /srv/www/customers/public
    user: www-customers
    group: www-customers
    index: index.php
    listing: false
    fastcgi_timeout: 120

# Backends charlotte connects to, alongside the spawned apps below. A TCP
# pool on the loopback interface:
    fastcgi: ["cgi=127.0.0.1:9001"]

# Apps charlotte starts and supervises for this virtual host. No worker starts
# at launch; the first request starts one, and more are started on demand when
# concurrent requests need them. Each worker has its own private FastCGI
# listening socket on file descriptor 0, using FCGI_LISTENSOCK_FILENO; do not
# pass php-cgi's `-b` option.
# Apps run as this vhost's user with the document root as their working
# directory. Their environment is cleared except for PATH and variables
# configured below. If an app exits (including after PHP_FCGI_MAX_REQUESTS),
# charlotte restarts it.
# Extensions must not collide with one declared in `fastcgi` above or another
# `fastcgi_app` entry.
    fastcgi_app:
      - extension: php

# argv for the child process: the program first, then its arguments. Must not
# be empty.
        command: ["/usr/bin/php8.4-cgi"]

# Optional. Maximum number of independently supervised workers to spawn on
# demand (1-256); defaults to 1.
        max_workers: 4

# Optional. Stop each idle worker after this many seconds (1-86400), allowing
# the pool to scale back to zero. Defaults to 60 seconds.
        idle_timeout: 60

# Optional environment for the child. Keys must look like shell identifiers:
# a letter or underscore, then letters, digits or underscores.
        env:
          PHP_FCGI_CHILDREN: "8"
          PHP_FCGI_MAX_REQUESTS: "1000"
          APP_ENV: production

# A second independently supervised app can map another extension to the same
# executable, with its own listening socket and environment.
      - extension: phtml
        command: ["/usr/bin/php8.4-cgi"]
        env: { PHP_FCGI_CHILDREN: "4", APP_ENV: production }


# --------------------------------------------------------------------------
# A host with no TLS of its own: reachable over plaintext, and over TLS only
# through the default host's certificate.
# --------------------------------------------------------------------------
  -
    server_names: [internal.example.com]
    root: /srv/www/internal
    user: www-internal
    listing: true
# Optional. Set false to exclude this virtual host from automatic ACME
# provisioning; it is enabled by default when --acme-directory is configured.
# For example, set `acme: false` here to opt out.
