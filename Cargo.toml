[package]
name = "project-charlotte"
version = "0.99.0"
edition = "2024"
default-run = "project-charlotte"
description = "General-purpose webserver and reverse proxy meant for large-scale environments"

[features]
default = ["acme", "hosting", "http3", "proxy", "swarm"]
# ACME (HTTP-01) certificate provisioning and renewal.
acme = ["dep:instant-acme", "dep:x509-parser"]
# The fallback site and virtual hosts with a document root: static files,
# FastCGI, CGI, and the per-host worker processes.
hosting = ["dep:fastcgi-client", "hyper/client"]
# The HTTP/3 (QUIC) listener.
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn"]
# Virtual hosts that forward to an HTTP or HTTPS upstream.
proxy = ["dep:hyper-rustls", "dep:tower-service", "hyper/client", "hyper-util/client-legacy"]
# Optional Redis-backed access checks, request recording, and nftables sets.
swarm = ["dep:redis"]

[[bin]]
name = "charlotte-worker"
path = "src/bin/charlotte-worker.rs"
required-features = ["hosting"]

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dns-lookup = "4.0.2"
fastcgi-client = { version = "0.12", features = ["tokio"], optional = true }
futures-util = "0.3"
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = "1"
http-body = "1"
http-body-util = "0.1"
libc = "0.2"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "native-tokio", "tls12"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"], optional = true }
libmodsecurity3-rs = { version = "0.1.1" }
nix = { version = "0.31.3", features = ["fs", "hostname", "poll", "process", "resource", "signal", "socket", "uio", "user"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
redis = { version = "0.29", default-features = false, features = ["aio", "tokio-comp", "connection-manager"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-service = { version = "0.3", optional = true }
url = "2"
x509-parser = { version = "0.18.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = { version = "8", default-features = false }

[dev-dependencies]
gungraun = "=0.20.0"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "tokio"] }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
test-fuzz = "8.1.1"

[[bench]]
name = "hot_paths"
harness = false

# Fat LTO with a single codegen unit measured ~2-5% faster than the default
# opt-level 3 and gave a ~33% smaller stripped binary, at roughly twice the
# release build time. The bench profile inherits these settings.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
debug = true

[package.metadata.deb]
maintainer = "Jeremy Hanmer <jhanmer@proton.me>"
copyright = "Copyright 2026, project-charlotte contributors"
section = "web"
depends = "$auto"
conflicts = "project-charlotte-proxy"
conf-files = ["/etc/default/project-charlotte"]
maintainer-scripts = "packaging"
systemd-units = { unit-scripts = "packaging/systemd", unit-name = "project-charlotte", enable = true }
assets = [
    ["target/release/project-charlotte", "usr/bin/", "755"],
    ["target/release/charlotte-worker", "usr/bin/", "755"],
    ["target/release/charlotte-ctl", "usr/bin/", "755"],
    ["target/release/apache2charlotte", "usr/bin/", "755"],
    ["target/release/nginx2charlotte", "usr/bin/", "755"],
    ["target/release/charlotte-configure", "usr/bin/", "755"],
    ["target/release/charlotte-admin", "usr/bin/", "755"],
    ["packaging/default/project-charlotte", "etc/default/project-charlotte", "644"],
    ["README.md", "usr/share/doc/project-charlotte/README.md", "644"],
    ["examples/charlotte.yaml", "usr/share/doc/project-charlotte/examples/charlotte.yaml", "644"],
]

# Reverse proxy only: TLS termination, ACME and HTTP/3, without static file
# hosting, FastCGI or CGI. Built with `cargo deb --variant proxy`.
[package.metadata.deb.variants.proxy]
name = "project-charlotte-proxy"
conflicts = "project-charlotte"
default-features = false
features = ["acme", "http3", "proxy"]
conf-files = ["/etc/default/project-charlotte"]
maintainer-scripts = "packaging"
systemd-units = { unit-scripts = "packaging/systemd", unit-name = "project-charlotte", enable = true }
assets = [
    ["target/release/project-charlotte", "usr/bin/", "755"],
    ["target/release/charlotte-ctl", "usr/bin/", "755"],
    ["target/release/apache2charlotte", "usr/bin/", "755"],
    ["target/release/nginx2charlotte", "usr/bin/", "755"],
    ["target/release/charlotte-configure", "usr/bin/", "755"],
    ["target/release/charlotte-admin", "usr/bin/", "755"],
    ["packaging/default/project-charlotte-proxy", "etc/default/project-charlotte", "644"],
    ["README.md", "usr/share/doc/project-charlotte-proxy/README.md", "644"],
    ["examples/charlotte.yaml", "usr/share/doc/project-charlotte-proxy/examples/charlotte.yaml", "644"],
    ["examples/reverse-proxy-acme.yaml", "usr/share/doc/project-charlotte-proxy/examples/reverse-proxy-acme.yaml", "644"],
]

[package.metadata.generate-rpm]
name = "project-charlotte"
release = "1.el9"
license = "Apache-2.0"
post_install_script = "packaging/rpm/post-install.sh"
pre_uninstall_script = "packaging/rpm/pre-uninstall.sh"
post_uninstall_script = "packaging/rpm/post-uninstall.sh"
assets = [
    { source = "target/release/project-charlotte", dest = "/usr/bin/project-charlotte", mode = "755" },
    { source = "target/release/charlotte-worker", dest = "/usr/bin/charlotte-worker", mode = "755" },
    { source = "target/release/charlotte-ctl", dest = "/usr/bin/charlotte-ctl", mode = "755" },
    { source = "target/release/apache2charlotte", dest = "/usr/bin/apache2charlotte", mode = "755" },
    { source = "target/release/nginx2charlotte", dest = "/usr/bin/nginx2charlotte", mode = "755" },
    { source = "target/release/charlotte-configure", dest = "/usr/bin/charlotte-configure", mode = "755" },
    { source = "target/release/charlotte-admin", dest = "/usr/bin/charlotte-admin", mode = "755" },
    { source = "packaging/default/project-charlotte", dest = "/etc/default/project-charlotte", mode = "644", config = true },
    { source = "packaging/systemd/project-charlotte.service", dest = "/usr/lib/systemd/system/project-charlotte.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/project-charlotte/README.md", mode = "644", doc = true },
    { source = "examples/charlotte.yaml", dest = "/usr/share/doc/project-charlotte/examples/charlotte.yaml", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
systemd = ""

[package.metadata.generate-rpm.conflicts]
project-charlotte-proxy = ""

[package.metadata.generate-rpm.variants.proxy]
name = "project-charlotte-proxy"
release = "1.el9"
license = "Apache-2.0"
post_install_script = "packaging/rpm/post-install.sh"
pre_uninstall_script = "packaging/rpm/pre-uninstall.sh"
post_uninstall_script = "packaging/rpm/post-uninstall.sh"
assets = [
    { source = "target/release/project-charlotte", dest = "/usr/bin/project-charlotte", mode = "755" },
    { source = "target/release/charlotte-ctl", dest = "/usr/bin/charlotte-ctl", mode = "755" },
    { source = "target/release/apache2charlotte", dest = "/usr/bin/apache2charlotte", mode = "755" },
    { source = "target/release/nginx2charlotte", dest = "/usr/bin/nginx2charlotte", mode = "755" },
    { source = "target/release/charlotte-configure", dest = "/usr/bin/charlotte-configure", mode = "755" },
    { source = "target/release/charlotte-admin", dest = "/usr/bin/charlotte-admin", mode = "755" },
    { source = "packaging/default/project-charlotte-proxy", dest = "/etc/default/project-charlotte", mode = "644", config = true },
    { source = "packaging/systemd/project-charlotte.service", dest = "/usr/lib/systemd/system/project-charlotte.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/project-charlotte-proxy/README.md", mode = "644", doc = true },
    { source = "examples/charlotte.yaml", dest = "/usr/share/doc/project-charlotte-proxy/examples/charlotte.yaml", mode = "644", doc = true },
    { source = "examples/reverse-proxy-acme.yaml", dest = "/usr/share/doc/project-charlotte-proxy/examples/reverse-proxy-acme.yaml", mode = "644", doc = true },
]

[package.metadata.generate-rpm.variants.proxy.requires]
systemd = ""

[package.metadata.generate-rpm.variants.proxy.conflicts]
project-charlotte = ""
