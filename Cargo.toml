[package]
name = "project-charlotte"
version = "0.6.0"
edition = "2024"
description = "Asynchronous web server for static sites and fastcgi dynamic content"

[dependencies]
bytes = "1"
caps = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastcgi-client = { version = "0.12", features = ["tokio"] }
futures-util = "0.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
modsecurity-rs = { git = "https://github.com/fzylogic/modsecurity-rs" }
nix = { version = "0.31.3", features = ["process", "signal", "user"] }
notify = { version = "8", default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = { version = "0.14.10", features = ["x509-parser"] }
test-fuzz = "8.1.1"

[package.metadata.deb]
maintainer = "Jeremy Hanmer <jhanmer@proton.me>"
copyright = "Copyright 2026, project-charlotte contributors"
section = "web"
depends = "$auto"
assets = [
    ["target/release/project-charlotte", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/project-charlotte/README.md", "644"],
]
