SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html
SecResponseBodyLimit 1048576
SecRule ARGS "@contains charlotte-demo-block" "id:100001,phase:2,deny,status:403,log,msg:'Charlotte demo request blocked'"
SecRule RESPONSE_BODY "@contains Charlotte-Demo-Response-Block" "id:100002,phase:4,deny,status:403,log,msg:'Charlotte demo response blocked'"