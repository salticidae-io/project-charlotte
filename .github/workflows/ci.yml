name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: Fuzzing time for each target, in seconds
        required: true
        default: 300
        type: number
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libmodsecurity-dev \
            modsecurity-crs

      - name: Check out project-charlotte
        uses: actions/checkout@v4
        with:
          path: project-charlotte

      - name: Check out modsecurity-rs
        uses: actions/checkout@v4
        with:
          repository: fzylogic/modsecurity-rs
          token: ${{ secrets.MODSECURITY_RS_TOKEN || github.token }}
          path: modsecurity-rs

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: project-charlotte -> target

      - name: Check formatting
        working-directory: project-charlotte
        run: cargo fmt --all -- --check

      - name: Run all tests
        working-directory: project-charlotte
        run: cargo test --locked

  root-tests:
    name: Privileged tests
    runs-on: ubuntu-24.04
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libmodsecurity-dev \
            modsecurity-crs

      - name: Check out project-charlotte
        uses: actions/checkout@v4
        with:
          path: project-charlotte

      - name: Check out modsecurity-rs
        uses: actions/checkout@v4
        with:
          repository: fzylogic/modsecurity-rs
          token: ${{ secrets.MODSECURITY_RS_TOKEN || github.token }}
          path: modsecurity-rs

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: project-charlotte -> target

      - name: Build tests as the runner user
        working-directory: project-charlotte
        run: cargo test --locked --no-run

      - name: Run root-only tests
        working-directory: project-charlotte
        run: sudo -E env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" cargo test --locked -- --ignored

  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libmodsecurity-dev \
            modsecurity-crs

      - name: Check out project-charlotte
        uses: actions/checkout@v4
        with:
          path: project-charlotte

      - name: Check out modsecurity-rs
        uses: actions/checkout@v4
        with:
          repository: fzylogic/modsecurity-rs
          token: ${{ secrets.MODSECURITY_RS_TOKEN || github.token }}
          path: modsecurity-rs

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: project-charlotte -> target

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage
        working-directory: project-charlotte
        run: cargo tarpaulin --locked

      - name: Add coverage summary to job summary
        if: always()
        working-directory: project-charlotte
        run: |
          if [ -f target/coverage/cobertura.xml ]; then
            python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = ET.parse("target/coverage/cobertura.xml").getroot()
          covered = int(report.attrib["lines-covered"])
          valid = int(report.attrib["lines-valid"])
          rate = float(report.attrib["line-rate"]) * 100

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Test coverage\n\n")
              summary.write(f"Line coverage: **{rate:.2f}%** ({covered}/{valid} lines)\n")
          PY
          else
            echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: project-charlotte/target/coverage/
          if-no-files-found: warn
          retention-days: 30

  features:
    name: Feature combinations
    runs-on: ubuntu-24.04
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libmodsecurity-dev

      - name: Check out project-charlotte
        uses: actions/checkout@v4
        with:
          path: project-charlotte

      - name: Check out modsecurity-rs
        uses: actions/checkout@v4
        with:
          repository: fzylogic/modsecurity-rs
          token: ${{ secrets.MODSECURITY_RS_TOKEN || github.token }}
          path: modsecurity-rs

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: project-charlotte -> target

      - name: Check every feature combination
        working-directory: project-charlotte
        run: scripts/check-features.sh --locked

      # The feature set of the project-charlotte-proxy package.
      - name: Test the proxy-only build
        working-directory: project-charlotte
        run: cargo test --locked --no-default-features --features acme,http3,proxy

      - name: Test the no-default-features build
        working-directory: project-charlotte
        run: cargo test --locked --no-default-features

  bench:
    name: Gungraun benchmarks
    runs-on: ubuntu-24.04
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libmodsecurity-dev \
            valgrind

      - name: Check out project-charlotte
        uses: actions/checkout@v4
        with:
          path: project-charlotte

      - name: Check out modsecurity-rs
        uses: actions/checkout@v4
        with:
          repository: fzylogic/modsecurity-rs
          token: ${{ secrets.MODSECURITY_RS_TOKEN || github.token }}
          path: modsecurity-rs

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Gungraun runner
        run: cargo install gungraun-runner --version 0.20.0 --locked

      - name: Run benchmarks
        working-directory: project-charlotte
        run: cargo bench --locked

  # The one status check to mark as required in the branch protection rule for
  # main. It always runs, and passes only when all validation jobs succeeded,
  # so a failed, cancelled or skipped job blocks the pull request.
  required:
    name: Required checks
    if: always()
    needs:
      - test
      - root-tests
      - coverage
      - features
      - bench
    runs-on: ubuntu-24.04
    steps:
      - name: Require all validation jobs to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          ROOT_TEST_RESULT: ${{ needs.root-tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          FEATURES_RESULT: ${{ needs.features.result }}
          BENCH_RESULT: ${{ needs.bench.result }}
        run: |
          echo "Tests: $TEST_RESULT"
          echo "Privileged tests: $ROOT_TEST_RESULT"
          echo "Coverage: $COVERAGE_RESULT"
          echo "Feature combinations: $FEATURES_RESULT"
          echo "Benchmarks: $BENCH_RESULT"
          test "$TEST_RESULT" = success
          test "$ROOT_TEST_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$FEATURES_RESULT" = success
          test "$BENCH_RESULT" = success

  fuzz:
    name: Fuzz targets
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      AFL_NO_UI: "1"
      AFL_SKIP_CPUFREQ: "1"
      # cargo-afl builds everything, including proc-macros that rustc loads,
      # with `-C target-cpu=native`. rust-cache then restores those artifacts
      # on runners with different CPUs, and rustc dies with SIGILL. cargo-afl
      # appends RUSTFLAGS after its own flags, so this portable target wins.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || (github.event_name == 'workflow_dispatch' && inputs.seconds_per_target) || '15' }}
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libmodsecurity-dev \
            modsecurity-crs \
            python3-dev

      - name: Check out project-charlotte
        uses: actions/checkout@v4
        with:
          path: project-charlotte

      - name: Check out modsecurity-rs
        uses: actions/checkout@v4
        with:
          repository: fzylogic/modsecurity-rs
          token: ${{ secrets.MODSECURITY_RS_TOKEN || github.token }}
          path: modsecurity-rs

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: project-charlotte -> target

      - name: Install AFL and test-fuzz
        run: |
          # rust-cache restores the cargo-afl binary from ~/.cargo/bin but not
          # ~/.cargo/registry/src, where cargo-afl expects the AFL++ sources
          # it builds from. Force the install so cargo re-extracts them.
          cargo install cargo-afl --locked --force
          # The AFL runtime can be restored from the Rust cache; rebuild it so
          # it always matches the current toolchain.
          cargo afl config --build --force
          cargo install cargo-test-fuzz --version 8.1.1 --locked
          echo core | sudo tee /proc/sys/kernel/core_pattern

      - name: Fuzz every target
        working-directory: project-charlotte
        run: scripts/fuzz.sh "$FUZZ_SECONDS"

      - name: Upload fuzz findings, corpus, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            project-charlotte/fuzz/findings/
            project-charlotte/fuzz/corpus/
            project-charlotte/target/fuzz-*.log
          if-no-files-found: warn
          retention-days: 30